<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tom Louvores — INVB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" type="image/png" href="logo2.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="apple-touch-icon" href="logo2.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e0e0e">
</head>
<body class="read-only">

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <img src="logo2.png" alt="Nova Vida Botafogo" class="logo-img" />
      <div class="logo-sep"></div>
      <span class="logo-sub">Tom<br>Louvores</span>
    </div>
    <div class="header-right">
      <div class="status-pill" id="statusPill">
        <span class="dot"></span>
        <span id="statusTxt">Conectando</span>
      </div>
      <!-- shown when logged out -->
      <button class="btn-add" id="btnLoginShow" onclick="abrirLogin()" style="display:none">🔒 Entrar</button>
      <!-- shown when logged in (admin) -->
      <button class="btn-add" id="btnNovaMusica" onclick="abrirModal()" style="display:none">+ Nova Música</button>
      <button class="btn-logout" id="btnLogout" onclick="logout()" style="display:none">Sair</button>
    </div>
  </div>
</header>

<!-- HERO -->
<section class="hero-outer">
  <div class="hero">
    <div>
      <div class="hero-tag">Botafogo · RJ</div>
      <h1 class="hero-h1">NOSSO<br><em>REPERTÓRIO</em></h1>
      <p class="hero-sub">Músicas, tons e ministrantes da INVB em um só lugar.</p>
    </div>
    <div class="hero-right-col">
      <div class="hero-stats">
        <div class="stat-row">
          <span class="stat-n" id="totalMusicas">0</span>
          <span class="stat-l">Músicas</span>
        </div>
        <div class="stat-row">
          <span class="stat-n" id="totalTons">0</span>
          <span class="stat-l">Tons</span>
        </div>
        <div class="stat-row">
          <span class="stat-n">5</span>
          <span class="stat-l">Ministr.</span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-ico">&#9906;</span>
    <input type="text" id="busca" class="inp-search" placeholder="Buscar música..." oninput="filtrar()"/>
  </div>
  <select id="filtroMin" class="sel" onchange="filtrar()">
    <option value="">Todos os ministrantes</option>
    <option>Raphaela</option><option>Daniela</option><option>Cris</option>
    <option>Mirian</option><option>Pr. Humberto</option>
  </select>
  <select id="filtroTom" class="sel" onchange="filtrar()">
    <option value="">Todos os tons</option>
  </select>
  <span class="count-badge" id="countBadge"></span>
</div>

<!-- GRID -->
<div class="grid-wrap">
  <div class="grid" id="grid">
    <div class="state-loading" id="stLoading">
      <div class="spinner"></div>
      <p style="font-size:12px;color:#555;font-weight:600;letter-spacing:0.08em;text-transform:uppercase">Carregando...</p>
    </div>
    <div class="state-empty" id="stEmpty">
      <div class="empty-sym">NO SONGS</div>
      <p class="empty-ttl">Nenhuma música</p>
      <p class="empty-sub">Clique em "+ Nova Música" para começar.</p>
    </div>
  </div>
</div>

<!-- MODAL MÚSICA -->
<div class="overlay-bg" id="overlay" onclick="fecharFora(event)">
  <div class="modal" id="modal">
    <div class="modal-hd">
      <h2 id="modalTitulo">NOVA MÚSICA</h2>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-bd">
      <div>
        <label class="flabel">Nome da música</label>
        <input type="text" id="fNome" class="finput" placeholder="Ex: Oceanos"/>
      </div>
      <div>
        <label class="flabel">Tons e Ministrantes</label>
        <div class="tom-add-row">
          <select id="fTom" class="finput">
            <option value="">Tom</option><option>Orig.</option>
            <option>C</option><option>C#</option><option>D</option><option>D#</option>
            <option>E</option><option>F</option><option>F#</option><option>G</option>
            <option>G#</option><option>A</option><option>A#</option><option>B</option>
            <option>Cm</option><option>C#m</option><option>Dm</option><option>D#m</option>
            <option>Em</option><option>Fm</option><option>F#m</option><option>Gm</option>
            <option>G#m</option><option>Am</option><option>A#m</option><option>Bm</option>
          </select>
          <select id="fMin" class="finput">
            <option value="">Ministrante</option>
            <option>Raphaela</option><option>Daniela</option><option>Cris</option>
            <option>Mirian</option><option>Pr. Humberto</option>
          </select>
          <button type="button" class="btn-add-tom" onclick="adicionarTomMin()">+</button>
        </div>
        <div class="tom-list" id="tomList"></div>
      </div>
      <div>
        <label class="flabel">Observações</label>
        <textarea id="fObs" class="finput ftextarea" placeholder="Link do YouTube, notas, etc."></textarea>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" id="btnSalvar" onclick="salvar()">SALVAR</button>
    </div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div id="loginOverlay" onclick="loginFecharFora(event)">
  <div class="login-box">
    <div>
      <h2>ÁREA ADMIN</h2>
      <p class="login-sub">Acesso restrito para edição do repertório.</p>
    </div>
    <div>
      <label>Usuário</label>
      <input type="text" id="loginUser" placeholder="admin" autocomplete="username" />
    </div>
    <div>
      <label>Senha</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') tentarLogin()" />
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="login-actions">
      <button class="btn-login-cancel" onclick="fecharLogin()">Cancelar</button>
      <button class="btn-login-submit" onclick="tentarLogin()">ENTRAR</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
